name: podcast sync v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/podcast-sync-v2.yml"
      - "scripts/**"
      - "requirements.txt"
  schedule:
    # Daily at 00:17 UTC (08:17 Asia/Shanghai), outside the top-of-hour peak.
    - cron: "17 0 * * *"

concurrency:
  group: podcast-sync-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check required secrets
        run: |
          python -c 'import os,sys; required=("NOTION_TOKEN","NOTION_PAGE","REFRESH_TOKEN"); missing=[k for k in required if not os.getenv(k)]; print("Required secrets configured" if not missing else "Missing secrets: "+", ".join(missing)); sys.exit(bool(missing))'

      - name: Check Python syntax
        run: python -m compileall -q scripts

      - name: Podcast sync
        run: python -u scripts/podcast.py
